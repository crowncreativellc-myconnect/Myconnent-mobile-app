<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Clock face ring -->
  <circle cx="16" cy="16" r="12" stroke="#F6C90E" stroke-width="1.5" fill="none" opacity="0.3"/>
  <!-- Clock arc — sweeping fast, short arc at top right -->
  <path d="M 16,4 A 12,12 0 0,1 26,10" stroke="#F6C90E" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- Hour hand pointing to ~1 o'clock — fast -->
  <line x1="16" y1="16" x2="21" y2="8" stroke="#F6C90E" stroke-width="2" stroke-linecap="round"/>
  <!-- Minute hand -->
  <line x1="16" y1="16" x2="22" y2="18" stroke="rgba(246,201,14,0.45)" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Lightning bolt overlaid — speed signal -->
  <path d="M 18,4 L 13,15 L 17,15 L 12,26 L 19,13 L 15,13 Z" fill="#F6C90E"/>
  <!-- Centre dot -->
  <circle cx="16" cy="16" r="2" fill="#F6C90E"/>
</svg>
