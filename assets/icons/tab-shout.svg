<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Speech bubble body -->
  <rect x="2" y="4" width="20" height="16" rx="4" stroke="#F6C90E" stroke-width="2" fill="none"/>
  <!-- Bubble tail -->
  <path d="M 7 20 L 2 28 L 14 20" stroke="#F6C90E" stroke-width="1.5" stroke-linejoin="round" fill="none"/>
  <!-- Three dots inside — message content -->
  <circle cx="8" cy="12" r="2" fill="#F6C90E"/>
  <circle cx="13" cy="12" r="2" fill="#F6C90E"/>
  <circle cx="18" cy="12" r="2" fill="#F6C90E"/>
  <!-- Arc signal radiating — broadcasting -->
  <path d="M 24 6 Q 29 11 29 16" stroke="#F6C90E" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7"/>
  <path d="M 27 3 Q 33 9 33 16" stroke="#F6C90E" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.35"/>
  <!-- Gold origin node -->
  <circle cx="22" cy="5" r="2.5" fill="#F6C90E"/>
  <!-- Blue AI node at signal end -->
  <circle cx="29" cy="16" r="2" fill="#4F6EF7"/>
</svg>
