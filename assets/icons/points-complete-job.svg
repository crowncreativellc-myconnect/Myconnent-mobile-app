<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Completion ring -->
  <circle cx="16" cy="16" r="12" stroke="#10B981" stroke-width="2" fill="none" opacity="0.3"/>
  <!-- Arc sweep — nearly complete -->
  <path d="M 16,4 A 12,12 0 1,1 7.5,23.4" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- Checkmark -->
  <path d="M 10,16 L 14,20 L 22,10" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Gold node at arc end — completion moment -->
  <circle cx="7.5" cy="23.4" r="3" fill="#F6C90E"/>
</svg>
