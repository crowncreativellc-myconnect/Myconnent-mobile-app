<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">

  <!-- Trigger grip handle -->
  <path d="M 3,13 Q 3,18 6,19 L 6,14 Q 5,12 3,13 Z"
    fill="rgba(246,201,14,0.2)" stroke="#F6C90E" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Finger guard -->
  <path d="M 6,19 Q 8,21 8,18"
    fill="none" stroke="#F6C90E" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Body box -->
  <path d="M 6,10 L 6,18 L 13,22 L 13,8 Z"
    fill="rgba(246,201,14,0.1)" stroke="#F6C90E" stroke-width="2" stroke-linejoin="round"/>

  <!-- Speaker grille lines on body -->
  <line x1="7.5" y1="11" x2="12" y2="9.5"
    stroke="rgba(246,201,14,0.4)" stroke-width="1" stroke-linecap="round"/>
  <line x1="7.5" y1="13.5" x2="12" y2="12"
    stroke="rgba(246,201,14,0.4)" stroke-width="1" stroke-linecap="round"/>
  <line x1="7.5" y1="16" x2="12" y2="14.5"
    stroke="rgba(246,201,14,0.4)" stroke-width="1" stroke-linecap="round"/>

  <!-- Exponential horn flare -->
  <path d="M 13,8 Q 19,6 24,2 Q 29,8 30,15 Q 29,22 24,28 Q 19,26 13,22"
    fill="rgba(246,201,14,0.06)" stroke="#F6C90E" stroke-width="2.2" stroke-linejoin="round"/>

  <!-- Bell rim — elliptical ring -->
  <ellipse cx="27" cy="15" rx="4.5" ry="13"
    fill="rgba(246,201,14,0.04)" stroke="#F6C90E" stroke-width="2"/>
  <!-- Inner depth ring -->
  <ellipse cx="25" cy="15" rx="2.8" ry="9.5"
    fill="none" stroke="rgba(246,201,14,0.2)" stroke-width="1"/>

  <!-- Signal arc 1 — strong -->
  <path d="M 32,5 Q 36,10 36,15 Q 36,20 32,25"
    fill="none" stroke="#F6C90E" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <!-- Signal arc 2 — medium -->
  <path d="M 35,1 Q 40,8 40,15 Q 40,22 35,29"
    fill="none" stroke="#F6C90E" stroke-width="1.5" stroke-linecap="round" opacity="0.45"/>
  <!-- Signal arc 3 — faint -->
  <path d="M 38,-2 Q 44,6 44,15 Q 44,24 38,32"
    fill="none" stroke="#F6C90E" stroke-width="1" stroke-linecap="round" opacity="0.2"/>

  <!-- Gold node — bell tip -->
  <circle cx="27" cy="15" r="3" fill="#F6C90E"/>
  <!-- Blue node — AI parse point (top of body) -->
  <circle cx="13" cy="8" r="2.5" fill="#4F6EF7"/>
  <!-- Green node — connection made (grip base) -->
  <circle cx="6" cy="16" r="2.5" fill="#10B981"/>

</svg>
